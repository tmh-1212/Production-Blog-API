version: "3.9"

services:

  api:
    build: .
    container_name: production-blog-api

    restart: unless-stopped

    ports:
      - "5000:5000"

    env_file:
      - .env

    depends_on:
      - mongodb

    volumes:
      - .:/app
      - /app/node_modules

    command: npm run dev

  mongodb:
    image: mongo:8

    container_name: production-blog-mongodb

    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: